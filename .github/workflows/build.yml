
name: Build MinecraftManager

on:
  workflow_dispatch:
  push:
    paths:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -o MinecraftManager-Paper-1.21.4-v1.4.0-Source.zip -d source

      - name: Build plugin
        run: |
          POM="$(find source -name pom.xml -print -quit)"
          test -n "$POM"
          cd "$(dirname "$POM")"
          mvn -B clean package
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;

      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftManager-JAR
          path: dist/*.jar
          
